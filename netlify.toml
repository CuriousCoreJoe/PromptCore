[build]
  command = "bun run build"
  publish = "dist"
[functions]
  directory = "netlify/functions"

# Increase timeout for execute function (image generation takes ~30s)
[functions."execute"]
  timeout = 60

[functions."chat"]
  timeout = 60

[dev]
  command = "bun run dev"
  targetPort = 3000
  port = 8888
  publish = "."
  functions_timeout = 60
  [dev.environment]
    NETLIFY_FUNCTIONS_TIMEOUT = "60"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200



